<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慢箋餘藥試算</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f7fb;
    padding: 15px;
}
.card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
}
input, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
}
.primary { background: #4CAF50; color: white; }
</style>
</head>

<body>

<div class="card">
<h2>慢箋餘藥試算</h2>

<input type="date" id="today">
<input type="date" id="startDate">
<input type="number" id="days" placeholder="每次天數">
<input type="number" id="totalTimes" placeholder="總領藥次數">
<input type="number" id="usedTimes" placeholder="已領次數">

<button class="primary" onclick="calculate()">試算</button>

<div id="result"></div>
</div>

<script>
document.getElementById("today").valueAsDate = new Date();

function calculate() {
    const today = new Date(document.getElementById("today").value);
    const start = new Date(document.getElementById("startDate").value);
    const days = parseInt(document.getElementById("days").value);
    const total = parseInt(document.getElementById("totalTimes").value);
    const used = parseInt(document.getElementById("usedTimes").value);

    if (!start || isNaN(days) || isNaN(total) || isNaN(used)) {
        document.getElementById("result").innerText = "請填寫完整資料";
        return;
    }

    const remain = (total - used) * days;

    const expire = new Date(start);
    expire.setDate(expire.getDate() + 90);

    let msg = `
剩餘：${remain} 天
到期：${expire.toLocaleDateString()}
`;

    msg += (today > expire) ? "\n⚠️ 已過期" : "\n✅ 可使用";

    document.getElementById("result").innerText = msg;
}
</script>

</body>
</html>
