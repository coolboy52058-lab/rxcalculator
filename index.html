<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭慢箋管理系統 v12 - UI 進階版</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --warning: #f39c12; --light: #f8f9fa; --text: #333; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f4f7f9; color: var(--text); padding: 15px; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 1.6em; }
        
        /* 區塊容器 */
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #edf2f7; }
        .group-box { border-top: 6px solid var(--accent); position: relative; }
        
        /* 表單設計 */
        .section-title { font-size: 1.1em; font-weight: bold; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: bold; font-size: 0.9em; color: #718096; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; background: #f0f9ff; }
        
        /* 按鈕設計 */
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        button:active { transform: scale(0.95); }
        
        .btn-main { padding: 16px; font-size: 1.05em; width: 100%; }
        .btn-save { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3); }
        .btn-calc { background: white; color: var(--accent); border: 2px solid var(--accent); }
        .btn-refresh { background: var(--primary); color: white; padding: 16px; font-size: 1.1em; margin-top: 10px; width: 100%; box-shadow: 0 4px 12px rgba(44, 62, 80, 0.3); }
        .btn-renew { background: #ebf8ff; color: #2b6cb0; padding: 6px 14px; font-size: 0.9em; border: 1px solid #bee3f8; }
        .btn-sm { padding: 8px 16px; font-size: 0.9em; border-radius: 8px; }
        .btn-add-log { background: #e6fffa; color: #2c7a7b; border: 1px solid #b2f5ea; }
        
        /* 卡片設計 */
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #e2e8f0; position: relative; transition: 0.3s; }
        .card.active-card { border-left: 8px solid var(--accent); background: #fdfdfd; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        /* 資訊字體調優 */
        .user-tag { background: #edf2f7; color: #2d3748; padding: 4px 12px; border-radius: 8px; font-size: 0.9em; font-weight: bold; }
        .med-name { font-size: 1.25em; font-weight: 900; color: var(--primary); margin-left: 8px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .highlight-large { color: #e53e3e; font-size: 1.3em; font-weight: 800; }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.85em; font-weight: bold; }
        .expired { background: #fff5f5; color: #c53030; }
        .active { background: #f0fff4; color: #2f855a; }
        
        .total-hand-badge { background: #fffaf0; color: #c05621; padding: 8px 16px; border-radius: 12px; font-weight: 800; border: 1px solid #feebc8; font-size: 1em; }
        .log-tag { display: inline-block; background: #f7fafc; border: 1px solid #e2e8f0; padding: 3px 8px; border-radius: 6px; margin: 2px; font-size: 0.85em; color: #4a5568; }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<h2>👨‍👩‍👧‍👦 家庭慢箋管理系統 v12</h2>

<div class="box">
    <div class="section-title">🔍 模擬試算與全域更新</div>
    <div class="grid">
        <div>
            <label>對象 / 藥名 (續開時自動帶入)</label>
            <input type="text" id="userName" placeholder="例如：爸爸">
            <input type="text" id="medName" placeholder="例如：血壓藥" style="margin-top:8px">
        </div>
        <div>
            <label>設定模擬基準日</label>
            <input type="date" id="simDate">
            <button class="btn-refresh" onclick="renderRecords()">🔄 更新下方所有圖卡資訊</button>
        </div>
    </div>
</div>

<div class="box">
    <div class="section-title">➕ 建立新慢箋</div>
    <div class="grid">
        <div><label>第1次領藥日</label><input type="date" id="startDate"></div>
        <div><label>單次開立天數</label><input type="number" id="days" value="30"></div>
    </div>
    <div class="grid">
        <div><label>總領藥次數</label><input type="number" id="totalTimes" value="3"></div>
        <div><label>初始已領次數</label><input type="number" id="usedTimes" value="1"></div>
    </div>
    <div class="btn-row" style="margin-top:20px;">
        <button class="btn-calc btn-main" onclick="runSimulation()">🧪 預覽計算結果</button>
        <button class="btn-save btn-main" onclick="saveRecord()">💾 儲存並加入清單</button>
    </div>
    <div id="tempResult" style="display:none; margin-top:20px; padding:15px; border-radius:12px; background:#fffaf0; border:1px solid #feebc8;"></div>
</div>

<div id="records"></div>

<script>
    let records = JSON.parse(localStorage.getItem("family_med_v12_group")) || [];
    document.getElementById('startDate').valueAsDate = new Date();
    document.getElementById('simDate').valueAsDate = new Date();

    function calculateSmart(r, targetDateStr) {
        const simDate = new Date(targetDateStr);
        simDate.setHours(0,0,0,0);
        const start = new Date(r.startDate);
        start.setHours(0,0,0,0);
        
        let handAmount = 0;
        const sortedLogs = [...r.logs].sort((a,b) => new Date(a) - new Date(b));
        if (sortedLogs.length === 0) return { hand: 0, total: 0, isLawExpired: false, status: "無紀錄", range: "N/A", count: 0 };
        
        let lastDate = new Date(sortedLogs[0]);
        lastDate.setHours(0,0,0,0);

        for(let i=0; i<sortedLogs.length; i++){
            const current = new Date(sortedLogs[i]);
            current.setHours(0,0,0,0);
            if(i>0){
                handAmount -= Math.floor((current - lastDate)/(1000*60*60*24));
                if(handAmount < 0) handAmount = 0;
            }
            handAmount += r.days;
            lastDate = current;
        }
        const gapToSim = Math.floor((simDate - lastDate)/(1000*60*60*24)) + 1;
        const finalHand = handAmount - gapToSim;

        const diffTime = simDate.getTime() - start.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
        const isLawExpired = diffDays > 92;

        let totalRemain = 0;
        if (!isLawExpired) {
            const timesLeft = r.totalTimes - sortedLogs.length;
            totalRemain = timesLeft > 0 ? timesLeft * r.days : 0;
        }

        const format = (d) => d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + String(d.getDate()).padStart(2,'0');
        const endDate = new Date(start);
        endDate.setDate(endDate.getDate() + (r.totalTimes * r.days) - 1);

        return {
            hand: finalHand > 0 ? finalHand : 0,
            total: totalRemain,
            isLawExpired: isLawExpired,
            status: isLawExpired ? "慢箋已過期" : (finalHand > 0 ? "服用中" : "藥已用罄"),
            range: `${format(start)} - ${format(endDate)}`,
            count: sortedLogs.length
        };
    }

    function runSimulation() {
        const startVal = document.getElementById("startDate").value;
        if(!startVal) return alert("請輸入領藥日期");
        const r = {
            startDate: startVal,
            days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: Array(parseInt(document.getElementById("usedTimes").value)).fill(startVal)
        };
        const res = calculateSmart(r, document.getElementById("simDate").value);
        const div = document.getElementById("tempResult");
        div.style.display = "block";
        div.innerHTML = `<div style="text-align:center;"><strong>🏠 模擬手上餘藥：<span class="highlight-large">${res.hand}</span> 天</strong><br><small>⏳ 狀態：${res.status} | 📜 箋剩餘總量：${res.total} 天</small></div>`;
    }

    function saveRecord() {
        const start = document.getElementById("startDate").value;
        if(!start) return alert("請選擇日期");
        const used = parseInt(document.getElementById("usedTimes").value);
        let logs = [];
        for(let i=0; i<used; i++) logs.push(start);
        records.push({
            id: Date.now(), user: document.getElementById("userName").value || "本人",
            med: document.getElementById("medName").value || "未註記",
            startDate: start, days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: logs, isEditing: false
        });
        sync();
        document.getElementById("tempResult").style.display = "none";
    }

    function sync() { localStorage.setItem("family_med_v12_group", JSON.stringify(records)); renderRecords(); }

    function fastRenew(user, med) {
        document.getElementById("userName").value = user;
        document.getElementById("medName").value = med;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderRecords() {
        const container = document.getElementById("records");
        container.innerHTML = "";
        const simDateStr = document.getElementById("simDate").value;

        const groups = {};
        records.forEach(r => {
            const key = `${r.user}-${r.med}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });

        Object.keys(groups).sort().forEach(key => {
            const groupRecords = groups[key].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            const [user, med] = key.split('-');
            
            let groupTotalHand = 0;
            groupRecords.forEach(r => groupTotalHand += calculateSmart(r, simDateStr).hand);

            const groupDiv = document.createElement("div");
            groupDiv.className = "box group-box";
            groupDiv.innerHTML = `
                <div class="group-header">
                    <div>
                        <span class="user-tag">${user}</span><span class="med-name">${med}</span>
                        <div style="margin-top:10px;"><button class="btn-renew" onclick="fastRenew('${user}', '${med}')">＋ 續開舊箋</button></div>
                    </div>
                    <div class="total-hand-badge">🏠 手上總餘藥：${groupTotalHand} 天</div>
                </div>
                <div id="sub-${key}"></div>
            `;

            const subContainer = groupDiv.querySelector(`#sub-${key}`);
            groupRecords.forEach(r => {
                const calc = calculateSmart(r, simDateStr);
                const card = document.createElement("div");
                card.className = `card ${calc.hand > 0 ? 'active-card' : ''}`;
                
                if (r.isEditing) {
                    let logsHtml = r.logs.map((d, i) => `
                        <div style="margin-bottom:8px;">
                            <label>第 ${i+1} 次領藥日</label>
                            <input type="date" class="edit-log-date" value="${d}">
                        </div>`).join('');
                    card.innerHTML = `<div class="edit-mode-box">
                        <div class="grid"><input type="text" class="edit-user" value="${r.user}"><input type="text" class="edit-med" value="${r.med}"></div>
                        <div class="grid" style="margin-top:10px;"><input type="date" class="edit-date" value="${r.startDate}"><input type="number" class="edit-days" value="${r.days}"></div>
                        <label style="margin-top:10px;">總開立次數</label><input type="number" class="edit-total" value="${r.totalTimes}">
                        <div style="margin-top:15px; background:#f7fafc; padding:10px; border-radius:10px;">${logsHtml}</div>
                        <div class="btn-row" style="margin-top:15px;">
                            <button class="btn-save btn-sm" onclick="updateRecord(${r.id})">✅ 保存修改</button>
                            <button class="btn-sm" style="background:#edf2f7;" onclick="toggleEdit(${r.id})">取消</button>
                        </div>
                    </div>`;
                } else {
                    card.innerHTML = `
                    <div class="card-header">
                        <div><small style="color:#718096;">📅 箋效期範圍</small><br><strong>${calc.range}</strong></div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-sm" style="background:#f7fafc; border:1px solid #e2e8f0;" onclick="toggleEdit(${r.id})">修改</button> 
                            <button class="btn-sm" style="background:#fff5f5; color:#c53030;" onclick="deleteRecord(${r.id})">刪除</button>
                        </div>
                    </div>
                    <div class="info-grid">
                        <div class="full">
                            <label>📦 領藥紀錄</label>
                            ${r.logs.map(l=>`<span class="log-tag">${l}</span>`).join('')} 
                            <button class="btn-sm btn-add-log" onclick="addLog(${r.id})">＋領藥</button>
                        </div>
                        <div><label>🔁 領藥進度</label><strong>${calc.count} / ${r.totalTimes} 次</strong></div>
                        <div><label>⏳ 目前狀態</label><span class="status-badge ${calc.isLawExpired ? 'expired' : 'active'}">${calc.status}</span></div>
                        <div><label>🏠 手上餘藥</label><span class="highlight-large">${calc.hand} 天</span></div>
                        <div><label>📜 箋剩餘總量</label><strong>${calc.total} 天</strong></div>
                    </div>`;
                }
                subContainer.appendChild(card);
            });
            container.appendChild(groupDiv);
        });
    }

    function addLog(id) {
        const r = records.find(r => r.id === id);
        const calc = calculateSmart(r, document.getElementById('simDate').value);
        if (calc.isLawExpired) return alert("慢箋已過期！");
        if (r.logs.length >= r.totalTimes) return alert("領取次數已滿！");
        const date = prompt("請確認領藥日期 (YYYY-MM-DD):", document.getElementById('simDate').value);
        if (date) { r.logs.push(date); sync(); }
    }

    // 修正後的修改切換功能
    function toggleEdit(id) {
        const index = records.findIndex(r => r.id === id);
        if (index !== -1) {
            records[index].isEditing = !records[index].isEditing;
            renderRecords();
        }
    }

    function deleteRecord(id) {
        if(confirm("確定要移除這份慢箋紀錄嗎？")) {
            records = records.filter(r => r.id !== id);
            sync();
        }
    }

    function updateRecord(id) {
        const card = document.querySelector(`[onclick="updateRecord(${id})"]`).closest('.edit-mode-box');
        const r = records.find(rec => rec.id === id);
        r.user = card.querySelector(".edit-user").value;
        r.med = card.querySelector(".edit-med").value;
        r.startDate = card.querySelector(".edit-date").value;
        r.days = parseInt(card.querySelector(".edit-days").value);
        r.totalTimes = parseInt(card.querySelector(".edit-total").value);
        const newLogs = [];
        card.querySelectorAll(".edit-log-date").forEach(input => newLogs.push(input.value));
        r.logs = newLogs;
        r.isEditing = false;
        sync();
    }

    renderRecords();
</script>
</body>
</html>
